version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types: [minor, patch]
      tanstack-router:
        patterns:
          - "@tanstack/*"
        update-types: [minor, patch]
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
        update-types: [minor, patch]
      forms:
        patterns:
          - react-hook-form
          - "@hookform/resolvers"
          - zod
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
